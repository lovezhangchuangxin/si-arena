packages:
  - apps/*
  - packages/*
  - games/*

# 公开包统一版本（lockstep）：发版经 `pnpm change` 记录意图、`pnpm version -r` 统一提升；
# private 包不参与版本管理。详见 docs/architecture/deployment.md。
versioning:
  fixed:
    - [
        "@si-arena/protocol",
        "@si-arena/sandbox",
        "@si-arena/runner",
        "@si-arena/engine",
        "@si-arena/player",
        "@si-arena/cli",
      ]
  ignore:
    - "@si-arena/development"
    - "@si-arena/game-paper"
    - "@si-arena/game-tank"
    - "@si-arena/game-tetris"
    - "@si-arena/game-bomber"
    - "@si-arena/game-cube"
    - "@si-arena/game-royale"
    - "@si-arena/game-snake"
    - "@si-arena/game-danmaku"
    - "@si-arena/db"
    - "@si-arena/server"
    - "@si-arena/worker"
    - "@si-arena/web"

catalog:
  "fflate": "0.8.3"
  "isolated-vm": "7.0.1"
  "acorn": "8.19.0"
  "typescript": "6.0.3"
  "tsdown": "0.23.1"
  "vitest": "5.0.5"
  "@vitest/coverage-v8": "5.0.5"
  "jsdom": "30.1.3"
  "@vue/test-utils": "2.5.1"
  "tar": "7.5.22"
  "@types/node": "26.6.5"
  "vue": "3.5.44"
  "vue-router": "5.4.0"
  "vite": "8.3.4"
  "@vitejs/plugin-vue": "6.0.10"
  "tailwindcss": "4.3.3"
  "@tailwindcss/vite": "4.3.3"
  "vue-tsc": "3.3.13"
  "fastify": "5.12.7"
  "drizzle-orm": "0.45.4"
  "drizzle-kit": "0.31.11"
  "pg": "8.23.1"
  "@types/pg": "8.23.1"
  "tsx": "4.23.15"
  "oxlint": "1.88.0"
  "oxfmt": "0.73.0"
  "simple-git-hooks": "2.14.0"
  "lint-staged": "17.6.0"
  "@commitlint/cli": "21.2.4"
  "@commitlint/config-conventional": "21.2.4"
  "@fontsource/chakra-petch": "5.3.0"
  "@fontsource/jetbrains-mono": "5.3.0"

minimumReleaseAgeExclude:
  - ret@0.5.1
  - "@commitlint/cli@21.2.4"
  - "@commitlint/config-conventional@21.2.4"
  - "@commitlint/ensure@21.2.4"
  - "@commitlint/lint@21.2.4"
  - "@commitlint/load@21.2.4"
  - "@commitlint/rules@21.2.4"

allowBuilds:
  esbuild: true
  # isolated-vm ships prebuilt binaries that node-gyp-build loads at require time;
  # its install script would only recompile them.
  isolated-vm: false
  simple-git-hooks: true
